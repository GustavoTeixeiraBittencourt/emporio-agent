[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agent"
version = "0.1.0"
description = "Text-message customer service agent for Empório da Música"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "holidays>=0.55",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pypdf>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
